# The whole stack on one small box (checklist item 11 infrastructure).
#   docker compose up -d              → postgres + n8n + brief service
#   docker compose --profile edge up -d   → adds caddy (public HTTPS for n8n webhooks)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brief
      POSTGRES_USER: brief
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brief -d brief"]
      interval: 5s
      timeout: 3s
      retries: 20

  brief:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://brief:${POSTGRES_PASSWORD}@postgres:5432/brief
      TZ: America/New_York
    depends_on:
      postgres:
        condition: service_healthy
    # never publish this port — n8n reaches it on the compose network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/New_York   # schedule triggers fire in ET, per spec
      TZ: America/New_York
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: https://${N8N_HOST:-localhost}/
      N8N_PORT: "5678"
      # passed through so workflow expressions can use {{$env.…}}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      ALERT_SLACK_USER_ID: ${ALERT_SLACK_USER_ID:-U_EXAMPLE}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"   # local only; caddy or an SSH tunnel fronts it
    depends_on:
      - brief

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - n8n

volumes:
  pg_data:
  n8n_data:
  caddy_data:
