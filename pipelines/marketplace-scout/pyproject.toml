[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplace-scout"
version = "0.2.0"
description = "Watches Facebook Marketplace (DC), scores deals against natural-language wants, negotiates within guardrails, preps one-tap payment + Lugg pickup."
requires-python = ">=3.10"
dependencies = [
    "ai-marketplace-monitor>=0.10",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "diskcache>=5.6",
    "geopy>=2.4",
    "tomli>=2.0; python_version < '3.11'",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
scout = "scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
